<html>
    <head>
        <title>After School App</title>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
        <script src="lessons.js"></script>
        <style>
            body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px;
            }

            h1 {
                font-size: 28px;
                margin: 0;
            }

            .lessons-container {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                padding: 5px;
                width: 100%;
            }

            .sortArea{
                display: inline-block;
                height:200px;

            }
            .holdLessons{
                display:flex;
                flex-wrap: wrap;
                gap: 20px;
                width: 75%;
                height: 100%;
            }
            .holdSort{
                display:flex;
                background-color: lavender;
                width:20%;
                height: 100%;
                margin: 100px 0;
                float: right;
            }
            .lesson {
                display: inline-flex;
                flex-direction: column;
                width: 300px;
                height: 170px;
                padding: 8px 10px;
                border: 1px solid purple;
                border-radius: 5px;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
            }

            .lesson-details {
                display: flex;
                flex: 1;
                width: 100%;
            }

            .lesson-image {
                width: 80px;
                height: 80px;
                border: 3px solid black;
                border-radius: 6px; 
            }
            .lesson-text {
                flex-direction: column;
                flex-grow: 1;
            }

            .lesson-text p {
                margin: 5px 0;
                font-size: 14px;
            }

            .add-button {
                margin-top: auto;
                align-self: center;
                padding: 8px 16px;
                background-color: purple;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 14px;
                cursor: pointer;
            }

            .add-button:hover {
                background-color: darkmagenta;
            }

            button:disabled {
                background-color: gray;
                color: white;
                cursor: not-allowed;
            }
            .cart-btn {
                background-color: purple;
                color: white;
                padding: 8px 14px;
                border-radius: 4px;
                border: none;
                cursor: pointer;
            }
        </style>
       
    </head>
    
    <body>
        <div id="app">
            <header>
                <h1 v-text="sitename"></h1>
                <button class="cart-btn" v-on:click="showCart" :disabled="cartItemCount == 0">
                    <i class="fa-solid fa-cart-plus"></i> View Cart ({{cartItemCount}})
                </button>
            </header>

            <main>
                <!--LESSON DISPLAY-->
                <div v-if="showLesson" class="lessons-container">
                    <div class="holdSort">
                        <div class="sortArea">
                            <h3>Sort by:</h3>
                            <p>
                                <input type="radio" id="subjectBtn" value="subject" v-model="sortLesson"/>
                                <label for="subjectBtn">Subject</label>
                            </p>
                            <p>
                                <input type="radio" id="locationBtn" value="location" v-model="sortLesson"/>
                                <label for="locationBtn">Location</label>
                            </p>
                            <p>
                                <input type="radio" id="priceBtn" value="price" v-model="sortLesson"/>
                                <label for="priceBtn">Price</label>
                            </p>
                            <p>
                                <input type="radio" id="spacesBtn" value="spaces" v-model="sortLesson"/>
                                <label for="spacesBtn">Spaces</label>
                            </p>
                            <span></span>
                            <h3>Order by:</h3>
                            <p>
                                <input type="radio" id="ascBtn" value="asc" v-model="sortOrder"/>
                                <label for="ascBtn">Ascending</label>
                            </p>
                            <p>
                                <input type="radio" id="descBtn" value="desc" v-model="sortOrder"/>
                                <label for="descBtn">Descending</label>
                            </p>

                        </div>
                    </div>
                    <div class="holdLessons">
                        <div class="lesson" v-for="lesson in sortedLessons">
                            <div class="lesson-details">
                            <!--lesson info-->
                                <div class="lesson-text">
                                    <p>Subject: {{lesson.subject}} </p>
                                    <p>Location: {{lesson.location}} </p>
                                    <p>Price: {{lesson.price}} </p>
                                    <p>Spaces: {{lesson.spaces}}</p>
                                </div>
                                <figure>
                                    <img class="lesson-image" v-bind:src="lesson.image">
                                </figure>
                            </div>
                            
                            <button class="add-button" v-on:click="addToCart(lesson)" :disabled="!canAddToCart(lesson)"> 
                                Add to cart
                            </button>

                            <!-- availability responses -->
                            <span v-if="lesson.spaces === cartCount(lesson.id)">Out of Stock!</span>
                            <span v-else-if="lesson.spaces - cartCount(lesson.id) < 5">
                                Only {{lesson.spaces - cartCount(lesson.id)}} left!
                            </span>
                            <span v-else>Buy now!</span>
                        </div>
                    </div>
                </div>

                
                 <div v-else>
                    <h2>Cart Page</h2>
                 </div>
                 
            </main>
        </div>

        <script type="text/javascript">
            let webstore = new Vue({
                el:'#app',
                data: {
                    sitename: 'After School App',
                    lessons: lessons, // vue property: array created in Js file
                    cart:[],
                    showLesson:true,
                    sortLesson: 'price',
                    sortOrder: 'asc',
                },
                methods:{
                    addToCart(lesson){
                        this.cart.push(lesson.id);
                    },
                    canAddToCart(lesson) {
                        return lesson.spaces > this.cartCount(lesson.id);
                    },
                    cartCount(id) {
                        let count = 0;
                        for(let i = 0; i < this.cart.length; i++) {
                            if (this.cart[i] === id) {
                                count++;
                            }
                        }
                        return count;
                    },
                    showCart(){
                        this.showLesson=this.showLesson ? false:true;
                    }
                },
                computed:{
                    cartItemCount: function() {
                        return this.cart.length || "";
                    },
                    sortedLessons() {
                       let sorted = this.lessons.slice();

                       sorted.sort((a, b) => {
                        let valA = a[this.sortLesson];
                        let valB = b[this.sortLesson];

                        if(typeof valA === 'string')
                            valA = valA.toLowerCase();
                        if(typeof valB === 'string')
                            valB = valB.toLowerCase();

                        if (valA < valB) 
                            return this.sortOrder === 'asc' ? -1 : 1;
                        if (valA > valB)
                            return this.sortOrder === 'desc' ? -1 : 1;
                        return 0;
                       });
                        return sorted;
                    }

                }
            }
        );
        </script>
    </body>
</html>
